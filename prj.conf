# Consola y logs por USB CDC-ACM (la placa lo habilita e inicializa).
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_LOG=y

# Bluetooth LE: rol periferico + servidor GATT.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="XIAO-FLOW"
CONFIG_BT_MAX_CONN=1

# El host BLE hace trabajo en la workqueue del sistema.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
